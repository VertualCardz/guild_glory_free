<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GW PATHSHALA VIP</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#030712;
color:#fff;
font-family:Arial,sans-serif
}
.box{
max-width:500px;
margin:auto;
padding:20px
}
.card{
background:#07111c;
border:1px solid #00ff66;
border-radius:16px;
padding:20px
}
h1,h2{
text-align:center;
color:#00ff66
}
input,select,button{
width:100%;
padding:14px;
margin:8px 0;
border-radius:8px;
font-size:16px
}
input,select{
background:#030712;
color:white;
border:1px solid #345
}
button{
background:#00ff66;
border:0;
font-weight:bold;
cursor:pointer
}
.step{display:none}
.step.active{display:block}
.bot{
border:1px solid #345;
padding:18px;
margin:10px 0;
border-radius:10px;
text-align:center;
cursor:pointer
}
.bot.selected{border-color:#00ff66}
.qr{
width:220px;
display:block;
margin:20px auto
}
#terminal{
background:#000;
color:#00ff66;
padding:15px;
min-height:150px;
font-family:monospace;
line-height:1.7
}
</style>
</head>

<body>

<div class="box">
<div class="card">

<div id="step1" class="step active">

<h1>GW PATHSHALA VIP</h1>
<h2>Guild Information</h2>

<input id="guildUid" type="text" placeholder="Enter Guild UID">

<input id="guildLevel" type="number" placeholder="Enter Guild Level">

<select id="guildRegion">
<option value="">Select Region</option>
<option value="India">India</option>
<option value="Brazil">Brazil</option>
<option value="Bangladesh">Bangladesh</option>
<option value="Singapore">Singapore</option>
</select>

<button onclick="go2()">CONTINUE →</button>

</div>


<div id="step2" class="step">

<h2>Select Bot</h2>

<div id="bot1" class="bot" onclick="chooseBot(1)">
SUPER BOT<br><br>
₹239
</div>

<div id="bot2" class="bot" onclick="chooseBot(2)">
ULTRA SUPER BOT<br><br>
₹450
</div>

<button onclick="go3()">PAYMENT →</button>

<button onclick="show(1)" style="background:#122019;color:#00ff66">
← BACK
</button>

</div>


<div id="step3" class="step">

<h2>Payment</h2>

<img src="qr.jpg.jpeg" class="qr">

<p style="text-align:center">
Scan QR & Pay
</p>

<input
id="paymentScreenshot"
type="file"
accept="image/*"
>

<button onclick="submitPayment()">
SUBMIT PAYMENT ✓
</button>

<button onclick="show(2)" style="background:#122019;color:#00ff66">
← BACK
</button>

</div>


<div id="step4" class="step">

<h2>Processing...</h2>

<div id="terminal"></div>

</div>


<div id="step5" class="step">

<h2>✓ SUCCESS</h2>

<p style="text-align:center">
Payment screenshot submitted successfully.
</p>

<p id="result" style="text-align:center;color:#00ff66"></p>

<button onclick="location.reload()">
DONE
</button>

</div>

</div>
</div>


<script>
var selectedBot=0;

function show(n){
document.querySelectorAll(".step").forEach(function(x){
x.classList.remove("active");
});
document.getElementById("step"+n).classList.add("active");
}

function go2(){

var uid=document.getElementById("guildUid").value.trim();
var level=document.getElementById("guildLevel").value.trim();
var region=document.getElementById("guildRegion").value;

if(uid===""||level===""||region===""){
alert("Please fill all details");
return;
}

show(2);
}

function chooseBot(n){

selectedBot=n;

document.getElementById("bot1").classList.remove("selected");
document.getElementById("bot2").classList.remove("selected");

document.getElementById("bot"+n).classList.add("selected");
}

function go3(){

if(selectedBot===0){
alert("Please select a bot");
return;
}

show(3);
}

function playSound(){

var AC=window.AudioContext||window.webkitAudioContext;

if(!AC)return;

var audio=new AC();
var oscillator=audio.createOscillator();
var gain=audio.createGain();

oscillator.frequency.value=800;
gain.gain.value=0.2;

oscillator.connect(gain);
gain.connect(audio.destination);

oscillator.start();
oscillator.stop(audio.currentTime+0.25);
}

function submitPayment(){

var file=document.getElementById("paymentScreenshot").files[0];

if(!file){
alert("Payment screenshot upload karo");
return;
}

playSound();

show(4);

var terminal=document.getElementById("terminal");

var logs=[
"Starting system...",
"Screenshot received...",
"Processing...",
"Request submitted...",
"Completed!"
];

var i=0;

function next(){

if(i>=logs.length){

setTimeout(function(){

var uid=document.getElementById("guildUid").value;
var region=document.getElementById("guildRegion").value;

document.getElementById("result").innerHTML=
"Guild UID: "+uid+"<br>Region: "+region;

show(5);

},700);

return;
}

terminal.innerHTML+=logs[i]+"<br>";
i++;

setTimeout(next,600);
}

next();
}
</script>

</body>
</html>
